name: Build Ventlog APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble Android source structure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/ventlog/free
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          cp MainActivity.java app/src/main/java/com/ventlog/free/MainActivity.java
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp app.js index.html style.css icon-192.png icon-512.png app/src/main/assets/
          cp ventlog_icon.png app/src/main/res/drawable/ventlog_icon.png
          test -s app/src/main/assets/app.js
          test -s app/src/main/java/com/ventlog/free/MainActivity.java
          test -s app/src/main/res/drawable/ventlog_icon.png

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          command -v sdkmanager

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Ventlog-Android15-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
